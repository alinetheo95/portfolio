<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aline Theodorakis - Portfolio</title>
    <style>
        .award-image-link {
            position: relative;
            display: block;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .award-image-link:hover {
            transform: scale(1.05);
        }
        .award-image-link:hover img {
            opacity: 1;
        }
        .award-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .award-image-link:hover .award-overlay {
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- Hero Section (Cover Page) -->
    <section class="hero-section" id="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>ALINE<br>THEODORAKIS</h1>
                <p class="subtitle">COMPUTATIONAL & ARCHITECTURAL DESIGNER</p>
            </div>
            <div class="hero-image" style="width: 50%; height: auto; position: absolute; right: 0; bottom: 0; top: auto; transform: none;">
                <a href="computation.html" class="award-image-link">
                    <img src="Images - computation page/circuit board-with mycelium 2.png" alt="Computation" style="width: 100%; height: auto; max-height: 80vh; object-fit: contain; object-position: bottom right; display: block; opacity: 0.7; transition: opacity 0.3s ease;">
                    <div class="award-overlay">
                        <span class="overlay-text">GSAPP MSCDP</span>
                    </div>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
