<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aline Theodorakis - Portfolio</title>
</head>

<body>
    <!-- Hero Section (Cover Page) -->
    <section class="hero-section" id="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>ALINE<br>THEODORAKIS</h1>
                <p class="subtitle">COMPUTATIONAL & ARCHITECTURAL DESIGNER</p>
            </div>
            <div class="hero-image">
                <img src="mycelium-2.png" alt="Portfolio Image">
            </div>
        </div>
        <div class="scroll-indicator" onclick="scrollToContent()"></div>
    </section>

    <!-- Content Section -->
    <section class="content-section" id="content">
        <div class="left-section">
            <div class="grid-container">
                <a href="architecture.html" class="grid-item large">
                    <img src="Images - title page/final drawing - transparent.png" alt="Architecture">
                    <div class="overlay">
                        <span class="overlay-text">ARCHITECTURE</span>
                    </div>
                </a>
                
                <a href="computation.html" class="grid-item">
                    <img src="Images - title page/circuit board-with mycelium.png" alt="Computation">
                    <div class="overlay">
                        <span class="overlay-text">COMPUTATION</span>
                    </div>
                </a>
                
                <a href="urban.html" class="grid-item">
                    <img src="Images - title page/Urban Tower-cropped.png" alt="Urban & Landscape Design">
                    <div class="overlay">
                        <span class="overlay-text">URBAN &<br>LANDSCAPE<br>DESIGN</span>
                    </div>
                </a>
                
                <a href="photography.html" class="grid-item">
                    <img src="Images - title page/photography.jpeg" alt="Photography">
                    <div class="overlay">
                        <span class="overlay-text">PHOTOGRAPHY</span>
                    </div>
                </a>
                
                <a href="art.html" class="grid-item">
                    <img src="Images - title page/Daylily.png" alt="Art">
                    <div class="overlay">
                        <span class="overlay-text">ART</span>
                    </div>
                </a>
            </div>

    <!-- About and Contact Buttons -->
    <div class="bottom-nav">
        <a href="about.html" class="nav-btn">ABOUT</a>
        <a href="contact.html" class="nav-btn">CONTACT</a>
    </div>
    
    <!--Link to JS-->
    <script src="main.js"></script>
</body>
</html>
